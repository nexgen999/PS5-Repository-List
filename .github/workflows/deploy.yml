name: Mettre à jour la base de données des dépôts

on:
  schedule:
    - cron: '0 * * * *' # S'exécute à chaque heure pile (minute 0)
  workflow_dispatch: # Permet de lancer la mise à jour manuellement depuis l'onglet Actions de GitHub
    inputs:
      force:
        description: 'Forcer le rafraîchissement complet (ignore le cache des README/commits)'
        type: boolean
        default: false

permissions:
  contents: write

# Un seul run à la fois : pas de deux jobs qui se battent pour le même push.
concurrency:
  group: update-repos-database
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1. Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Exécuter le script de mise à jour du JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
          UPDATE_CONCURRENCY: '24'
        run: node --version && node scripts/update-db.js

      - name: 3. Sauvegarder et commiter les modifications si le JSON a changé
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add json/repos-database.json
          # Vérifie s'il y a des changements, si oui commit et push, sinon ne fait rien
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: mise à jour automatique des stats des repos [skip ci]" && git push)
